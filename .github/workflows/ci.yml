
name: Integración Continua

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  pruebas:
    name: Pruebas unitarias e integración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r usuarios-service/requirements.txt
          pip install -r catalogo-service/requirements.txt
          pip install -r recomendaciones-service/requirements.txt
          pip install pytest httpx ruff


      # ANÁLISIS PYTHON

      - name: Analizar código Python con Ruff
        run: |
          python -m ruff check usuarios-service catalogo-service recomendaciones-service tests

      # ANÁLISIS DOCKERFILES

      - name: Analizar Dockerfile de Usuarios
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: usuarios-service/Dockerfile

      - name: Analizar Dockerfile de Catálogo
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: catalogo-service/Dockerfile

      - name: Analizar Dockerfile de Recomendaciones
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: recomendaciones-service/Dockerfile


      # PRUEBAS UNITARIAS

      - name: Probar usuarios
        working-directory: ./usuarios-service
        run: python -m pytest tests/ -v

      - name: Probar catálogo
        working-directory: ./catalogo-service
        run: python -m pytest tests/ -v

      - name: Probar recomendaciones
        working-directory: ./recomendaciones-service
        run: python -m pytest tests/ -v

      # PRUEBAS DE INTEGRACIÓN

      - name: Preparar variables de entorno
        run: cp .env.example .env

      - name: Levantar contenedores
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Comprobar estado de contenedores
        run: docker compose ps

      - name: Ejecutar pruebas de integración
        run: python -m pytest tests/test_integracion.py -v

      - name: Mostrar logs si hay errores
        if: failure()
        run: docker compose logs --no-color

      - name: Detener contenedores
        if: always()
        run: docker compose down
