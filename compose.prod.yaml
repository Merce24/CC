
name: recomendador-cloud

services:

  # MICROSERVICIO DE USUARIOS
  usuarios:
    image: ${USUARIOS_IMAGE:?Configurar USUARIOS_IMAGE}
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://${USUARIOS_DB_USER}:${USUARIOS_DB_PASSWORD}@postgres-usuarios:5432/${USUARIOS_DB_NAME}
    networks:
      - red-aplicacion
      - red-usuarios
    depends_on:
      postgres-usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # MICROSERVICIO DE CATÁLOGO
  catalogo:
    image: ${CATALOGO_IMAGE:?Configurar CATALOGO_IMAGE}
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql://${CATALOGO_DB_USER}:${CATALOGO_DB_PASSWORD}@postgres-catalogo:5432/${CATALOGO_DB_NAME}
    networks:
      - red-aplicacion
      - red-catalogo
    depends_on:
      postgres-catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # MICROSERVICIO DE RECOMENDACIONES
  recomendaciones:
    image: ${RECOMENDACIONES_IMAGE:?Configurar RECOMENDACIONES_IMAGE}
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      CATALOGO_URL: http://catalogo:8002
    networks:
      - red-aplicacion
    depends_on:
      catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # POSTGRESQL USUARIOS
  postgres-usuarios:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USUARIOS_DB_NAME}
      POSTGRES_USER: ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
    volumes:
      - datos-usuarios:/var/lib/postgresql/data
    networks:
      - red-usuarios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # POSTGRESQL CATÁLOGO
  postgres-catalogo:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    volumes:
      - datos-catalogo:/var/lib/postgresql/data
    networks:
      - red-catalogo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  red-aplicacion:
    driver: bridge

  red-usuarios:
    driver: bridge
    internal: true

  red-catalogo:
    driver: bridge
    internal: true

volumes:
  datos-usuarios:
  datos-catalogo:
